# Local/staging stack. Replace every placeholder; never commit real secrets.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: findway
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/findway
      APP_MASTER_KEY: ${APP_MASTER_KEY:?generate with: openssl rand -base64 48}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTCRM_BASE_URL: ${TRUSTCRM_BASE_URL:-}
      TRUSTCRM_SERVICE_EMAIL: ${TRUSTCRM_SERVICE_EMAIL:-}
      TRUSTCRM_SERVICE_PASSWORD: ${TRUSTCRM_SERVICE_PASSWORD:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-dev}
    ports: ["4000:4000"]
volumes:
  dbdata: {}
