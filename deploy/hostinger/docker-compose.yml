# VITA deployment for one VPS (Task 20): Postgres + the app + Caddy (automatic HTTPS).
#   cd deploy/hostinger && ./setup.sh          (first time: creates .env with generated secrets)
#   docker compose up -d --build               (later starts / after editing .env)
# Only Caddy publishes ports (80/443). The app (5000) and the database (5432) are reachable only inside the
# Docker networks; the database network has no internet access at all.
# Variables like ${DB_USER} are read from ./.env (the same file the app reads); the Postgres superuser lives in
# ./.env.db (db container only). Nothing secret is in this file.
name: vita

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # .env.db (generated by setup.sh, 600): POSTGRES_USER / POSTGRES_PASSWORD of the Postgres SUPERUSER. Only the
    # db container gets it; the app connects as the unprivileged DB_USER created by db-init/10-app-role.sh.
    env_file: .env.db
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env (run setup.sh)}
      VITA_APP_USER: ${DB_USER:?DB_USER must be set in .env (run setup.sh)}
      VITA_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (run setup.sh)}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 128mb
    networks: [backend]
    logging: *logging

  app:
    build:
      context: ../../trust-crm
    image: vita-app:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # fixed by this deployment (override whatever .env says)
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      PORT: "5000"
      STORAGE_DIR: /data/storage
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/data/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
    expose: ["5000"]
    networks: [backend, frontend]
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set in .env (run setup.sh)}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_MAX_BODY: ${CADDY_MAX_BODY:-12MB}
    # Writes the optional ACME e-mail into the snippet the Caddyfile imports (only a plain address is accepted),
    # then starts Caddy exactly as the image does.
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /tmp/caddy-global.d
        rm -f /tmp/caddy-global.d/*.caddy
        case "$${ACME_EMAIL}" in
          "") ;;
          *[!A-Za-z0-9._%+@-]*|*@*@*|@*|*@) echo "ACME_EMAIL is not a plain e-mail address - ignored" >&2 ;;
          *@*.*) printf 'email %s\n' "$${ACME_EMAIL}" > /tmp/caddy-global.d/acme-email.caddy ;;
          *) echo "ACME_EMAIL is not a plain e-mail address - ignored" >&2 ;;
        esac
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  db-data:
  app-storage:
  caddy-data:
  caddy-config:
